services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mailing-backend
    ports:
      -"8000:8000"
    env_file:
      - ./backend/ .venv
    restart: unless-stopped


  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mailing-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
